# tarifler klasöründeki uygulamayı Android APK'ya çevirir
# ve reponun Releases sayfasına yükler.
name: Tarifler APK

on:
  push:
    branches: ["main"]
    paths:
      - "tarifler/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android projesini hazırla
        run: |
          mkdir apk && cd apk
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp -r ../tarifler/* www/
          rm -f www/sw.js
          npx cap init "Yemek Tarifleri" com.enskygr234.tarifler --web-dir www
          npx cap add android

      - name: Uygulama simgesini koy
        run: |
          cd apk/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="mipmap-${pair%%:*}"; size="${pair##*:}"
            convert "$GITHUB_WORKSPACE/tarifler/icons/icon-1024.png" -resize ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: APK derle
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../YemekTarifleri.apk

      - name: Releases sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tarifler-${{ github.run_number }}
          name: Yemek Tarifleri (sürüm ${{ github.run_number }})
          body: |
            Telefonuna kurmak için aşağıdaki **YemekTarifleri.apk** dosyasını indir ve aç.
            İlk kurulumda "bilinmeyen kaynaklara izin ver" demen gerekebilir.
          files: YemekTarifleri.apk
          make_latest: true
